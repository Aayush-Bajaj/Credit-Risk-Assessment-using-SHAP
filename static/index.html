<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Risk Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="grid"></span></div>

<header class="top">
  <div class="logo">◆</div>
  <div>
    <h1>Credit Risk <span>Analyzer</span></h1>
    <p>AI-powered loan default prediction</p>
  </div>
</header>

<main class="layout">
  <form id="form" class="card" autocomplete="off">
    <div class="sec">Applicant</div>
    <div class="row">
      <label>Age<input type="number" name="person_age" min="18" max="99" required></label>
      <label>Annual income ($)<input type="number" name="person_income" min="1" required></label>
      <label>Home ownership
        <select name="person_home_ownership" required>
          <option value="RENT">Rent</option><option value="OWN">Own</option>
          <option value="MORTGAGE">Mortgage</option><option value="OTHER">Other</option>
        </select>
      </label>
      <label>Employment (years)<input type="number" name="person_emp_length" min="0" max="60" step="0.5" required></label>
    </div>

    <div class="sec">Loan</div>
    <div class="row">
      <label>Purpose
        <select name="loan_intent" required>
          <option value="PERSONAL">Personal</option><option value="EDUCATION">Education</option>
          <option value="MEDICAL">Medical</option><option value="VENTURE">Venture</option>
          <option value="HOMEIMPROVEMENT">Home improvement</option><option value="DEBTCONSOLIDATION">Debt consolidation</option>
        </select>
      </label>
      <label>Grade
        <select name="loan_grade" required>
          <option>A</option><option>B</option><option>C</option><option>D</option>
          <option>E</option><option>F</option><option>G</option>
        </select>
      </label>
      <label>Amount ($)<input type="number" name="loan_amnt" min="1" required></label>
      <label>Interest rate (%)<input type="number" name="loan_int_rate" min="0" step="0.01" required></label>
      <label class="wide">Loan % of income <em>(auto)</em><input type="number" name="loan_percent_income" step="0.01" readonly required></label>
    </div>

    <div class="sec">Credit history</div>
    <div class="row">
      <label>Previous default?
        <select name="cb_person_default_on_file" required><option value="N">No</option><option value="Y">Yes</option></select>
      </label>
      <label>History length (years)<input type="number" name="cb_person_cred_hist_length" min="0" required></label>
    </div>

    <div class="actions">
      <button type="submit" id="go" class="btn"><span>Analyze risk</span></button>
      <button type="button" id="sample" class="ghost">Fill sample</button>
    </div>
  </form>

  <aside id="result" class="card res">
    <div class="gauge">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e6e8ec"/><stop offset="1" stop-color="#9da1a8"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="100" cy="100" r="80" pathLength="100"/>
        <circle id="ring" class="ring" cx="100" cy="100" r="80" pathLength="100" stroke-dasharray="0 100"/>
        <line id="tick" x1="100" y1="6" x2="100" y2="32" transform="rotate(0 100 100)"/>
      </svg>
      <div class="center"><b id="pct">--</b><small>default probability</small></div>
    </div>
    <div id="badge" class="badge idle">Awaiting analysis</div>
    <p id="msg" class="msg">Fill in the form and press <b>Analyze risk</b> to see the result.</p>
    <div class="stats">
      <div><small>Threshold</small><b id="thr">--</b></div>
      <div><small>Decision</small><b id="dec">--</b></div>
    </div>
  </aside>
</main>

<footer>Predictions are model estimates, not financial advice.</footer>
<script src="script.js"></script>
</body>
</html>
